<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19324a">
  <title>Deutsch Uben | German Practice Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/auth.js"></script>
  <style>
    :root {
      --ink: #19324a;
      --muted: #a8bac8;
      --nav: #19324a;
      --nav-deep: #10263a;
      --line: rgba(255, 255, 255, .14);
      --accent: #e28a58;
      --bg: #edf1f0;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    #shell { width: 100%; min-width: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    #navbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px max(16px, calc((100vw - 1180px) / 2));
      background: var(--nav);
      box-shadow: 0 5px 18px rgba(16, 38, 58, .16);
      flex-wrap: wrap;
    }

    .brand {
      flex: 0 0 auto;
      margin-right: 12px;
      color: #fffaf2;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
      font-weight: 700;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }

    .tab-btn:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    .tab-btn.active { background: #fffaf2; border-color: #fffaf2; color: var(--ink); }

    .account-area { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .account-email { max-width: 190px; overflow: hidden; color: var(--muted); font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }
    .account-btn { min-height: 36px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: #fffaf2; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 700; }
    .account-btn:hover { background: rgba(255, 255, 255, .1); }

    .auth-overlay { position: fixed; z-index: 10; inset: 0; display: none; place-items: center; padding: 16px; background: rgba(16, 38, 58, .58); }
    .auth-overlay.open { display: grid; }
    .auth-panel { width: min(100%, 390px); padding: 24px; border-radius: 14px; background: #fffaf2; box-shadow: 0 20px 60px rgba(16, 38, 58, .3); }
    .auth-panel h2 { margin: 0 0 6px; color: var(--ink); font-size: 1.35rem; }
    .auth-panel p { margin: 0 0 16px; color: #60758a; font-size: .88rem; }
    .auth-panel label { display: block; margin: 10px 0 5px; color: var(--ink); font-size: .78rem; font-weight: 700; }
    .auth-panel input { width: 100%; padding: 11px; border: 1px solid #d9e1e7; border-radius: 9px; font: inherit; }
    .auth-actions { display: flex; gap: 8px; margin-top: 16px; }
    .auth-actions button { flex: 1; padding: 10px; border: 0; border-radius: 9px; cursor: pointer; font: inherit; font-weight: 700; }
    #authSubmit { background: var(--ink); color: #fff; }
    #authCancel { background: #e7edf0; color: var(--ink); }
    .auth-switch { margin-top: 12px !important; text-align: center; cursor: pointer; color: var(--accent) !important; }
    .auth-status { min-height: 20px; margin-top: 10px !important; color: #8f4327 !important; }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
    .tab-btn[data-tab="vocab"] .dot { background: #75a68c; }
    .tab-btn[data-tab="prep"] .dot { background: #80a8c6; }

    #frames { position: relative; flex: 1; min-width: 0; min-height: 0; }

    iframe {
      display: none;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      background: var(--bg);
    }

    iframe.active { display: block; }

    .loading-msg {
      display: grid;
      min-height: 0;
      place-items: center;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      #navbar { align-items: stretch; padding: 9px 10px; }
      .brand { display: none; }
      .tab-btn { min-width: 0; flex: 1 1 calc(50% - 4px); justify-content: center; padding: 8px 7px; font-size: .78rem; white-space: normal; }
      .tab-label { min-width: 0; text-align: center; }
      iframe { min-height: 0; }
    }
  </style>
</head>
<body>
  <main id="shell">
    <nav id="navbar" aria-label="Practice activities">
      <div class="brand">Deutsch <span>Uben</span></div>
      <button class="tab-btn active" data-tab="verbs" type="button"><span class="dot"></span><span class="tab-label">German Verbs</span></button>
      <button class="tab-btn" data-tab="vocab" type="button"><span class="dot"></span><span class="tab-label">Vocabulary Flashcards</span></button>
      <button class="tab-btn" data-tab="prep" type="button"><span class="dot"></span><span class="tab-label">Preposition Practice</span></button>
      <button class="tab-btn" data-tab="articles" type="button"><span class="dot"></span><span class="tab-label">Article Practice</span></button>
      <div class="account-area">
        <span class="account-email" id="accountEmail"></span>
        <button class="account-btn" id="accountButton" type="button">Sign in</button>
      </div>
    </nav>
    <section id="frames" aria-live="polite">
      <div class="loading-msg" id="loadingMsg">Loading practice...</div>
    </section>
  </main>
  <div class="auth-overlay" id="authOverlay">
    <form class="auth-panel" id="authForm">
      <h2 id="authTitle">Sign in</h2>
      <p id="authDescription">Use your verified email to keep your learning progress separate.</p>
      <label for="authEmail">Email address</label>
      <input id="authEmail" type="email" autocomplete="email" required>
      <label for="authPassword">Password</label>
      <input id="authPassword" type="password" minlength="6" autocomplete="current-password" required>
      <p class="auth-status" id="authStatus"></p>
      <div class="auth-actions"><button id="authCancel" type="button">Cancel</button><button id="authSubmit" type="submit">Sign in</button></div>
      <p class="auth-switch" id="authSwitch">Create an account</p>
    </form>
  </div>
  <script>
    const LAST_TAB_KEY = "deutsch-hub-last-tab";
    const frames = {};
    const framesElement = document.getElementById("frames");
    const loadingMessage = document.getElementById("loadingMsg");
    const accountButton = document.getElementById("accountButton");
    const accountEmail = document.getElementById("accountEmail");
    const authOverlay = document.getElementById("authOverlay");
    const authForm = document.getElementById("authForm");
    const authTitle = document.getElementById("authTitle");
    const authDescription = document.getElementById("authDescription");
    const authSubmit = document.getElementById("authSubmit");
    const authSwitch = document.getElementById("authSwitch");
    const authStatus = document.getElementById("authStatus");
    let authMode = "signin";
    let currentUserId = DeutschAuth.getScope();

    function openAuth(mode) {
      authMode = mode;
      authTitle.textContent = mode === "signin" ? "Sign in" : "Create account";
      authDescription.textContent = mode === "signin" ? "Use your verified email to keep your learning progress separate." : "We will send a verification link to your email address.";
      authSubmit.textContent = mode === "signin" ? "Sign in" : "Create account";
      authSwitch.textContent = mode === "signin" ? "Create an account" : "Already have an account? Sign in";
      authStatus.textContent = "";
      authOverlay.classList.add("open");
    }

    function refreshAccount(user) {
      const nextId = user ? user.id : "guest";
      const changed = currentUserId !== nextId;
      currentUserId = nextId;
      DeutschAuth.setScope(user);
      accountEmail.textContent = user ? user.email : "";
      accountButton.textContent = user ? "Sign out" : "Sign in";
      if (changed && Object.keys(frames).length) {
        Object.values(frames).forEach((frame) => { frame.src = frame.src.split("?")[0] + "?auth=" + Date.now(); });
      }
    }

    accountButton.addEventListener("click", async () => {
      if (currentUserId === "guest") openAuth("signin");
      else await DeutschAuth.signOut();
    });
    document.getElementById("authCancel").addEventListener("click", () => authOverlay.classList.remove("open"));
    authSwitch.addEventListener("click", () => openAuth(authMode === "signin" ? "signup" : "signin"));
    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      authStatus.textContent = "Working...";
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const result = authMode === "signin" ? await DeutschAuth.signIn(email, password) : await DeutschAuth.signUp(email, password);
      if (result.error) { authStatus.textContent = result.error.message; return; }
      if (authMode === "signup" && !result.data.session) {
        authStatus.textContent = "Check your email to verify your account.";
        return;
      }
      authOverlay.classList.remove("open");
    });

    DeutschAuth.getSession().then(({ data }) => refreshAccount(data.session?.user || null));
    DeutschAuth.onAuthStateChange((_event, session) => refreshAccount(session?.user || null));

    function activateTab(tab) {
      document.querySelectorAll(".tab-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === tab);
      });

      Object.entries(frames).forEach(([name, frame]) => {
        frame.classList.toggle("active", name === tab);
      });

      if (!frames[tab]) {
        const frame = document.createElement("iframe");
        frame.title = document.querySelector(`[data-tab="${tab}"] .tab-label`).textContent.trim();
        frame.src = `apps/${tab}.html?v=20260907`;
        frame.className = "active";
        framesElement.appendChild(frame);
        frames[tab] = frame;
        loadingMessage?.remove();
      }

      try { localStorage.setItem(LAST_TAB_KEY, tab); } catch (error) { /* storage is optional */ }
    }

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => activateTab(button.dataset.tab));
    });

    let startTab = "verbs";
    try {
      const savedTab = localStorage.getItem(LAST_TAB_KEY);
      if (savedTab && document.querySelector(`[data-tab="${savedTab}"]`)) startTab = savedTab;
    } catch (error) { /* storage is optional */ }
    activateTab(startTab);
  </script>
</body>
</html>
