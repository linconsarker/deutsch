<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#19324a">
  <title>Deutsch Uben | German Practice Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="shared/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="shared/auth.js"></script>
  <style>
    :root {
      --ink: var(--du-ink);
      --nav: var(--du-ink);
      --accent: var(--du-accent);
      --bg: var(--du-paper);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      overflow-x: hidden;
    }

    #shell { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    .navbar-hub { background: var(--nav) !important; box-shadow: 0 5px 18px rgba(16, 38, 58, .16); }

    .navbar-brand { color: #fffaf2 !important; font-weight: 700; letter-spacing: .02em; }
    .navbar-brand span { color: var(--accent); }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: rgba(255, 250, 242, .68) !important;
      font-size: .76rem;
      font-weight: 700;
      border-radius: .5rem;
    }

    .tab-btn:hover { color: #fff !important; background: rgba(255, 255, 255, .08); }
    .tab-btn.active { background: #fffaf2 !important; color: var(--ink) !important; }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
    .tab-btn[data-tab="vocab"] .dot { background: #75a68c; }
    .tab-btn[data-tab="prep"] .dot { background: #80a8c6; }
    .tab-btn[data-tab="pronouns"] .dot { background: #a98cc0; }

    .account-email {
      max-width: 190px;
      overflow: hidden;
      color: rgba(255, 250, 242, .72);
      font-size: .78rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (min-width: 992px) {
      #navContent { min-width: 0; }
      #navContent .navbar-nav {
        min-width: 0;
        flex: 1 1 auto;
        flex-wrap: nowrap !important;
        overflow-x: auto;
        scrollbar-width: none;
      }

      #navContent .navbar-nav::-webkit-scrollbar { display: none; }
      #navContent > .d-flex { flex: 0 0 auto; }
    }

    .account-btn {
      --bs-btn-color: #fffaf2;
      --bs-btn-border-color: rgba(255, 255, 255, .3);
      --bs-btn-hover-bg: rgba(255, 255, 255, .1);
      --bs-btn-hover-color: #fffaf2;
      --bs-btn-hover-border-color: rgba(255, 255, 255, .4);
      font-size: .78rem;
      font-weight: 700;
    }

    .navbar-toggler {
      --bs-navbar-toggler-icon-bg: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 250, 242, 1)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2.5' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
      border-color: rgba(255, 250, 242, .45) !important;
      padding: .4rem .6rem;
    }

    .navbar-toggler:focus { box-shadow: 0 0 0 .2rem rgba(226, 138, 88, .4); }

    #frames { position: relative; flex: 1; min-width: 0; min-height: 0; }

    iframe {
      display: none;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      border: 0;
      background: var(--bg);
    }

    iframe.active { display: block; }

    .loading-msg {
      display: grid;
      height: 100%;
      place-items: center;
      color: var(--ink);
    }

    #authModal .modal-title { color: var(--ink); }
    #authSwitch { cursor: pointer; }
  </style>
</head>
<body>
  <main id="shell">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-hub" aria-label="Practice activities">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
          <div class="navbar-nav flex-row flex-wrap gap-2 my-2 my-lg-0">
            <button class="btn tab-btn" data-tab="pronunciation" type="button"><span class="dot"></span><span class="tab-label">Pronunciation Practice</span></button>
            <button class="btn tab-btn" data-tab="vocab" type="button"><span class="dot"></span><span class="tab-label">Dictionary</span></button>
            <button class="btn tab-btn" data-tab="particles" type="button"><span class="dot"></span><span class="tab-label">Modal Particles &amp; Fillers</span></button>
            <button class="btn tab-btn" data-tab="articles" type="button"><span class="dot"></span><span class="tab-label">Article Trainer</span></button>
            <button class="btn tab-btn active" data-tab="verbs" type="button"><span class="dot"></span><span class="tab-label">German Verbs</span></button>
            <button class="btn tab-btn" data-tab="pronouns" type="button"><span class="dot"></span><span class="tab-label">Pronoun Practice</span></button>
            <button class="btn tab-btn" data-tab="prep" type="button"><span class="dot"></span><span class="tab-label">Preposition Practice</span></button>
            <button class="btn tab-btn" data-tab="translation" type="button"><span class="dot"></span><span class="tab-label">Translation Practice</span></button>
          </div>
          <div class="account-area d-flex align-items-center gap-2 ms-lg-auto mt-2 mt-lg-0">
            <span class="account-email" id="accountEmail"></span>
            <button class="btn btn-outline-light account-btn" id="accountButton" type="button">Sign in</button>
          </div>
        </div>
      </div>
    </nav>
    <section id="frames" aria-live="polite">
      <div class="loading-msg" id="loadingMsg">Loading practice...</div>
    </section>
  </main>

  <div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="authForm">
          <div class="modal-header">
            <h2 class="modal-title h5" id="authTitle">Sign in</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="text-muted small" id="authDescription">Use your verified email to keep your learning progress separate.</p>
            <div class="mb-3">
              <label for="authEmail" class="form-label small fw-bold">Email address</label>
              <input id="authEmail" type="email" class="form-control" autocomplete="email" required>
            </div>
            <div class="mb-2">
              <label for="authPassword" class="form-label small fw-bold">Password</label>
              <input id="authPassword" type="password" class="form-control" minlength="6" autocomplete="current-password" required>
            </div>
            <p class="small text-danger mb-0" id="authStatus"></p>
          </div>
          <div class="modal-footer justify-content-between">
            <span class="link-primary small" id="authSwitch">Create an account</span>
            <button type="submit" class="btn btn-primary" id="authSubmit">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const LAST_TAB_KEY = "deutsch-hub-last-tab";
    const frames = {};
    const framesElement = document.getElementById("frames");
    const loadingMessage = document.getElementById("loadingMsg");
    const accountButton = document.getElementById("accountButton");
    const accountEmail = document.getElementById("accountEmail");
    const authModalEl = document.getElementById("authModal");
    const authModal = new bootstrap.Modal(authModalEl);
    const authForm = document.getElementById("authForm");
    const authTitle = document.getElementById("authTitle");
    const authDescription = document.getElementById("authDescription");
    const authSubmit = document.getElementById("authSubmit");
    const authSwitch = document.getElementById("authSwitch");
    const authStatus = document.getElementById("authStatus");
    let authMode = "signin";
    let currentUserId = DeutschAuth.getScope();
    let currentSession = null;

    function broadcastSession(session) {
      currentSession = session || null;
      Object.values(frames).forEach((frame) => {
        frame.contentWindow?.postMessage({ type: "deutsch-auth-session", session: currentSession }, "*");
      });
    }

    function openAuth(mode) {
      authMode = mode;
      authTitle.textContent = mode === "signin" ? "Sign in" : "Create account";
      authDescription.textContent = mode === "signin" ? "Use your verified email to keep your learning progress separate." : "We will send a verification link to your email address.";
      authSubmit.textContent = mode === "signin" ? "Sign in" : "Create account";
      authSwitch.textContent = mode === "signin" ? "Create an account" : "Already have an account? Sign in";
      authStatus.textContent = "";
      authModal.show();
    }

    function refreshAccount(user) {
      const nextId = user ? user.id : "guest";
      const changed = currentUserId !== nextId;
      currentUserId = nextId;
      DeutschAuth.setScope(user);
      accountEmail.textContent = user ? user.email : "";
      accountButton.textContent = user ? "Sign out" : "Sign in";
      if (changed && Object.keys(frames).length) {
        Object.values(frames).forEach((frame) => { frame.src = frame.src.split("?")[0] + "?auth=" + Date.now(); });
      }
    }

    accountButton.addEventListener("click", async () => {
      if (currentUserId === "guest") openAuth("signin");
      else await DeutschAuth.signOut();
    });
    authSwitch.addEventListener("click", () => openAuth(authMode === "signin" ? "signup" : "signin"));
    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      authStatus.textContent = "Working...";
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const result = authMode === "signin" ? await DeutschAuth.signIn(email, password) : await DeutschAuth.signUp(email, password);
      if (result.error) { authStatus.textContent = result.error.message; return; }
      if (authMode === "signup" && !result.data.session) {
        authStatus.textContent = "Check your email to verify your account.";
        return;
      }
      authModal.hide();
    });

    DeutschAuth.getSession().then(({ data }) => refreshAccount(data.session?.user || null));
    DeutschAuth.getSession().then(({ data }) => broadcastSession(data.session || null));
    DeutschAuth.onAuthStateChange((_event, session) => {
      refreshAccount(session?.user || null);
      broadcastSession(session || null);
    });

    function activateTab(tab) {
      document.querySelectorAll(".tab-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === tab);
      });

      Object.entries(frames).forEach(([name, frame]) => {
        frame.classList.toggle("active", name === tab);
      });

      if (!frames[tab]) {
        const frame = document.createElement("iframe");
        frame.title = document.querySelector(`[data-tab="${tab}"] .tab-label`).textContent.trim();
        frame.src = `apps/${tab}.html?v=20260916`;
        frame.className = "active";
        frame.addEventListener("load", () => broadcastSession(currentSession), { once: true });
        framesElement.appendChild(frame);
        frames[tab] = frame;
        loadingMessage?.remove();
      }

      const navCollapse = bootstrap.Collapse.getInstance(document.getElementById("navContent"));
      if (navCollapse && document.getElementById("navContent").classList.contains("show")) navCollapse.hide();

      try { localStorage.setItem(LAST_TAB_KEY, tab); } catch (error) { /* storage is optional */ }
    }

    document.querySelectorAll(".tab-btn").forEach((button) => {
      button.addEventListener("click", () => activateTab(button.dataset.tab));
    });

    let startTab = "verbs";
    try {
      const savedTab = localStorage.getItem(LAST_TAB_KEY);
      if (savedTab && document.querySelector(`[data-tab="${savedTab}"]`)) startTab = savedTab;
    } catch (error) { /* storage is optional */ }
    activateTab(startTab);
  </script>
</body>
</html>
