<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>German Articles Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
  <style>
    :root {
      --paper: var(--du-paper);
      --ink: var(--du-ink);
      --ink-soft: var(--du-ink-soft);
      --muted: var(--du-muted);
      --line: var(--du-line);
      --card: var(--du-surface);
      --rule: var(--du-line);
      --accent: var(--du-action);
      --accent-dark: var(--du-action-dark);
      --success: var(--du-success);
      --bad: var(--du-danger);
      --level-a1: var(--du-a1);
      --level-a2: var(--du-a2);
      --level-b1: var(--du-b1);
      --article-der: var(--du-der);
      --article-die: var(--du-die);
      --article-das: var(--du-das);
      --shadow: var(--du-shadow);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---- page shell: everything fits, nothing scrolls ---- */
    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
    }

    /* ---- top strip ---- */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .page-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .article-mark { display: inline-flex; width: 22px; height: 22px; flex-shrink: 0; color: var(--article-der); }

    .page-title small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
    }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .ghost-btn {
      height: 32px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink-soft);
      font: 600 .78rem inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }

    .ghost-btn:hover { border-color: var(--ink-soft); color: var(--ink); }

    /* ---- filters (mirrors the Dictionary page's filter-col layout) ---- */
    .filters {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-col { flex: 1 1 0; min-width: 0; }
    .filter-col.col-level { flex: 0 0 auto; }

    .filter-label {
      display: block;
      color: var(--muted);
      font-size: .625rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .levels { display: flex; gap: 6px; flex-wrap: wrap; }

    .level-button {
      height: 32px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font: 600 .76rem inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: all .15s;
    }

    .level-button:hover { border-color: var(--ink-soft); color: var(--ink); }
    .level-button[data-level="A1"].active { background: var(--level-a1); border-color: var(--level-a1); color: #fff; }
    .level-button[data-level="A2"].active { background: var(--level-a2); border-color: var(--level-a2); color: #fff; }
    .level-button[data-level="B1"].active { background: var(--level-b1); border-color: var(--level-b1); color: #fff; }

    .category-select {
      width: 100%;
      height: 32px;
      padding: 0 30px 0 10px;
      border: 1.5px solid var(--line);
      border-radius: 6px;
      background-color: var(--card);
      color: var(--ink);
      font: 400 .76rem inherit;
      letter-spacing: .02em;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2364798d'><path d='M5.5 7.5l4.5 5 4.5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 13px;
    }

    .category-select:focus { outline: none; border-color: var(--accent); }

    /* ---- progress row (mirrors the Dictionary page's good/bad bar) ---- */
    .progress-row {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      font-size: .72rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-row strong { color: var(--ink); }

    .progress-track {
      flex: 1;
      height: 5px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
    }

    .progress-fill-good { height: 100%; background: var(--success); }
    .progress-fill-bad { height: 100%; background: var(--bad); opacity: .55; }

    /* ---- the card ---- */
    .card-area {
      flex: 0 1 auto;
      min-height: 0;
      margin-top: clamp(6px, 2vh, 18px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .practice-card {
      position: relative;
      flex: 0 1 auto;
      width: 100%;
      max-width: 480px;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 32px 22px 18px;
      border: 1px solid var(--rule);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
    }

    /* corner badges, mirroring the Dictionary flashcard's type-chip / level-chip */
    .type-chip {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: .66rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chip-row { position: absolute; top: 8px; right: 12px; display: flex; gap: 5px; align-items: center; }

    .level-chip {
      font-size: .62rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .level-chip.A1 { background: var(--level-a1); }
    .level-chip.A2 { background: var(--level-a2); }
    .level-chip.B1 { background: var(--level-b1); }

    .word-zone {
      flex: 1 1 auto;
      min-height: clamp(84px, 15vh, 132px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, .8vh, 8px);
      overflow: hidden;
    }

    .word {
      font-size: clamp(1.6rem, min(8vw, 6.4vh), 3.4rem);
      font-weight: 700;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .meaning {
      color: var(--muted);
      font-size: clamp(.82rem, 2vh, 1rem);
      line-height: 1.3;
    }

    .feedback {
      min-height: 1.4em;
      font-size: clamp(.78rem, 1.9vh, .95rem);
      font-weight: 700;
    }

    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--bad); }

    /* article reveal pill, mirroring the Dictionary flashcard's article-pill */
    .article-pill {
      display: inline-block;
      font-size: .78rem;
      letter-spacing: .03em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-right: 4px;
      color: #fff;
      text-transform: lowercase;
      vertical-align: middle;
    }

    .article-pill.der { background: var(--article-der); }
    .article-pill.die { background: var(--article-die); }
    .article-pill.das { background: var(--article-das); }

    /* reason box, mirroring the Dictionary flashcard's example-box */
    .reason-box {
      margin-top: 8px;
      padding: 8px 12px;
      border-left: 3px solid var(--success);
      background: rgba(0, 0, 0, .025);
      border-radius: 4px;
      text-align: left;
      font-size: .78rem;
      font-weight: 400;
      color: var(--ink-soft);
      line-height: 1.4;
      width: 100%;
    }

    .reason-box.wrong { border-left-color: var(--bad); }

    .options {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-top: clamp(10px, 2vh, 18px);
    }

    .article-option {
      height: clamp(42px, 7.2vh, 58px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      color: #fff;
      font: 700 clamp(.95rem, 2.4vh, 1.15rem) inherit;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }

    .article-option[data-article="der"] { background: var(--article-der); }
    .article-option[data-article="die"] { background: var(--article-die); }
    .article-option[data-article="das"] { background: var(--article-das); }
    .article-option:hover:not(:disabled) { filter: brightness(1.08); }
    .article-option:active:not(:disabled) { transform: translateY(1px); }
    .article-option:disabled { opacity: .5; cursor: default; }

    .card-actions {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: clamp(8px, 1.6vh, 14px);
    }

    .tip-example { background: rgba(185, 138, 47, .14); color: #8a6a1f; }

    .tip-group { padding: 14px 16px; border-radius: 10px; margin-bottom: 14px; border: 1px solid var(--rule); border-left-width: 4px; background: var(--card); }
    .tip-group:last-child { margin-bottom: 0; }
    .tip-group-der { border-left-color: var(--article-der); }
    .tip-group-die { border-left-color: var(--article-die); }
    .tip-group-das { border-left-color: var(--article-das); }
    .tip-group-strategy { border-left-color: var(--ink-soft); }
    .tip-group-title { font-family: var(--du-font); font-weight: 700; font-size: 1rem; margin-bottom: 8px; }
    .tip-group-der .tip-group-title { color: var(--article-der); }
    .tip-group-die .tip-group-title { color: var(--article-die); }
    .tip-group-das .tip-group-title { color: var(--article-das); }
    .tip-group-strategy .tip-group-title { color: var(--ink-soft); }
    .tip-mnemonic { font-size: .85rem; font-weight: 600; color: var(--ink); background: rgba(0, 0, 0, .035); padding: 8px 12px; border-radius: 8px; margin: 0 0 12px; line-height: 1.4; }
    .tip-rule { margin-bottom: 12px; }
    .tip-rule:last-child { margin-bottom: 0; }

    #tipsModal .modal-content { border-radius: 10px; background: var(--card); }
    #tipsModal .modal-title { font-family: var(--du-font); }

    @media (max-width: 480px) {
      .site-navbar { gap: 10px; }
      .topbar { flex-wrap: wrap; }
      .filters { gap: 6px; }
      .filter-col.col-level { flex: 1 0 100%; }
    }
  </style>
</head>

  <div class="modal fade" id="tipsModal" tabindex="-1" aria-labelledby="tipsTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="tipsTitle">Remembering German articles</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function loadJson(path) {
      const request = new XMLHttpRequest();
      request.open("GET", path, false);
      request.send(null);
      if (request.status !== 200 && request.status !== 0) throw new Error("Could not load " + path);
      return JSON.parse(request.responseText);
    }

    const nouns = loadJson("../data/vocabulary.json").filter((card) =>
      card.type === "noun" && ["der", "die", "das"].includes(card.article)
    );
    const articleTips = loadJson("../data/article-tips.json");
    const levels = ["A1", "A2", "B1"];
    const categoryLabels = {
      general: "General", food: "Food & Drink", travel_transport: "Travel & Transport",
      shopping_clothing: "Shopping & Clothing", home_living: "Home & Living",
      work_office: "Work & Office", tech_media: "Tech & Media", school_education: "School & Education",
      sports_leisure: "Sports & Leisure", colors: "Colors", body_parts: "Body Parts",
      fruits_vegetables: "Fruits & Vegetables", time_seasons: "Time & Seasons",
      countries: "Countries", language: "Language", communication: "Communication",
      emotions_personality: "Emotions", events_celebrations: "Events & Celebrations", health: "Health",
      nationality: "Nationality", nature_animals: "Nature & Animals", numbers: "Numbers",
      people_relationships: "People & Family"
    };
    const categories = [...new Set(nouns.map((card) => card.category))].sort((a, b) =>
      (categoryLabels[a] || a).localeCompare(categoryLabels[b] || b)
    );
    let activeLevels = levels.slice();
    let activeCategory = "ALL";
    const levelsElement = document.getElementById("levels");
    const categoryElement = document.getElementById("category");
    const tipsModal = new bootstrap.Modal(document.getElementById("tipsModal"));
    const wordElement = document.getElementById("word");
    const meaningElement = document.getElementById("meaning");
    const feedbackElement = document.getElementById("feedback");
    const scoreElement = document.getElementById("score");
    const optionElements = [...document.querySelectorAll(".article-option")];
    let deck = [];
    let index = 0;
    let correct = 0;
    let attempts = 0;
    let answered = false;

    function filteredNouns() {
      return nouns.filter((card) => {
        if (!activeLevels.includes(card.level)) return false;
        if (activeCategory === "COGNATE" && !card.cognate) return false;
        if (activeCategory === "OPPOSITE" && !card.opposite) return false;
        if (! ["ALL", "COGNATE", "OPPOSITE"].includes(activeCategory) && card.category !== activeCategory) return false;
        return true;
      });
    }

    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function exampleChips(examples) {
      return '<div class="d-flex flex-wrap gap-2">' +
        examples.map((example) => '<span class="tip-example badge rounded-pill text-dark fw-normal px-3 py-2">' + example + '</span>').join("") +
        '</div>';
    }

    function renderTips() {
      const groupsHtml = articleTips.articleGroups.map((group) =>
        '<section class="tip-group tip-group-' + group.article + '">' +
          '<h3 class="tip-group-title">' + group.label + '</h3>' +
          '<p class="tip-mnemonic">💡 ' + group.mnemonic + '</p>' +
          group.rules.map((rule) =>
            '<div class="tip-rule"><p class="text-muted small mb-2">' + rule.tip + '</p>' + exampleChips(rule.examples) + '</div>'
          ).join("") +
        '</section>'
      ).join("");

      const strategiesHtml =
        '<section class="tip-group tip-group-strategy">' +
          '<h3 class="tip-group-title">General strategies</h3>' +
          articleTips.strategies.map((item) =>
            '<div class="tip-rule"><p class="fw-semibold mb-1 small">' + item.title + '</p><p class="text-muted small mb-2">' + item.tip + '</p>' + exampleChips(item.examples) + '</div>'
          ).join("") +
        '</section>';

      document.getElementById("tipsList").innerHTML = groupsHtml + strategiesHtml;
    }

    function updateScore() {
      scoreElement.textContent = correct + " / " + attempts;
      const wrong = attempts - correct;
      document.getElementById("fillGood").style.width = (attempts ? (correct / attempts * 100) : 0) + "%";
      document.getElementById("fillBad").style.width = (attempts ? (wrong / attempts * 100) : 0) + "%";
    }

    function articleReason(card) {
      const word = card.stem.toLocaleLowerCase("de");
      const endings = {
        der: [["ling", "Words ending in -ling are masculine."], ["ismus", "Words ending in -ismus are masculine."], ["or", "Words ending in -or are masculine."], ["er", "Many person and occupation nouns ending in -er are masculine."]],
        die: [["ung", "Words ending in -ung are feminine."], ["heit", "Words ending in -heit are feminine."], ["keit", "Words ending in -keit are feminine."], ["schaft", "Words ending in -schaft are feminine."], ["tät", "Words ending in -tät are feminine."], ["ion", "Words ending in -ion are feminine."], ["ik", "Words ending in -ik are feminine."], ["ei", "Words ending in -ei are feminine."], ["e", "Many non-compound nouns ending in -e are feminine."]],
        das: [["chen", "Diminutives ending in -chen are neuter."], ["lein", "Diminutives ending in -lein are neuter."], ["tum", "Words ending in -tum are neuter."], ["ment", "Words ending in -ment are neuter."], ["um", "Many words ending in -um are neuter."]]
      };
      const match = endings[card.article].find(([ending]) => word.endsWith(ending));
      if (match) return match[1];
      if (card.article === "der" && card.category === "time_seasons") return "Days, months, seasons, and many time words are masculine.";
      if (card.article === "das" && word.endsWith("en")) return "Infinitives used as nouns are neuter.";
      return "There is no reliable ending rule here, so learn “" + card.article + " " + card.stem + "” as one vocabulary item.";
    }

    const typeChipElement = document.getElementById("typeChip");
    const levelChipElement = document.getElementById("levelChip");

    function renderCard() {
      if (!deck.length) {
        wordElement.textContent = "No words found";
        meaningElement.textContent = "Try another level or category.";
        feedbackElement.textContent = "";
        typeChipElement.textContent = "";
        levelChipElement.textContent = "";
        levelChipElement.className = "level-chip";
        optionElements.forEach((button) => { button.disabled = true; });
        return;
      }
      const card = deck[index];
      answered = false;
      wordElement.textContent = card.stem;
      meaningElement.textContent = card.en;
      feedbackElement.textContent = "";
      feedbackElement.className = "feedback";
      typeChipElement.textContent = categoryLabels[card.category] || card.category;
      levelChipElement.textContent = card.level;
      levelChipElement.className = "level-chip " + card.level;
      optionElements.forEach((button) => { button.disabled = false; });
    }

    function answer(article) {
      if (answered) return;
      answered = true;
      const card = deck[index];
      attempts += 1;
      optionElements.forEach((button) => { button.disabled = true; });
      const isCorrect = article === card.article;
      if (isCorrect) correct += 1;
      feedbackElement.className = "feedback " + (isCorrect ? "correct" : "wrong");
      feedbackElement.innerHTML =
        '<span class="article-pill ' + card.article + '">' + card.article + "</span>" +
        (isCorrect ? "Correct!" : "Incorrect — it's " + card.article + " " + card.stem) +
        '<div class="reason-box' + (isCorrect ? "" : " wrong") + '">' + articleReason(card) + "</div>";
      meaningElement.textContent = card.en;
      updateScore();
    }

    function nextWord() {
      index = (index + 1) % deck.length;
      renderCard();
    }

    function reshuffle() {
      deck = shuffle(filteredNouns());
      index = 0;
      renderCard();
    }

    function renderFilters() {
      levelsElement.innerHTML = "";
      levels.forEach((level) => {
        const button = document.createElement("button");
        button.className = "level-button" + (activeLevels.includes(level) ? " active" : "");
        button.type = "button";
        button.dataset.level = level;
        button.textContent = level + " (" + nouns.filter((card) => card.level === level).length + ")";
        button.addEventListener("click", () => {
          if (activeLevels.includes(level)) {
            if (activeLevels.length === 1) return;
            activeLevels = activeLevels.filter((item) => item !== level);
          } else {
            activeLevels.push(level);
          }
          renderFilters();
          reshuffle();
        });
        levelsElement.appendChild(button);
      });

      categoryElement.innerHTML = '<option value="ALL">All categories</option>' +
        '<option value="COGNATE">≈ Like English (cognates)</option>' +
        '<option value="OPPOSITE">↔ Words with Opposites</option>' +
        categories.map((category) => '<option value="'+category+'">'+(categoryLabels[category] || category)+'</option>').join("");
      categoryElement.value = activeCategory;
    }

    optionElements.forEach((button) => button.addEventListener("click", () => answer(button.dataset.article)));
    document.getElementById("next").addEventListener("click", nextWord);
    document.getElementById("shuffle").addEventListener("click", reshuffle);
    document.getElementById("tipsButton").addEventListener("click", () => tipsModal.show());
    categoryElement.addEventListener("change", () => {
      activeCategory = categoryElement.value;
      reshuffle();
    });
    renderFilters();
    renderTips();
    reshuffle();
  </script>
</body>
</html>
