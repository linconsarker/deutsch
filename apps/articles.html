<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>German Articles Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
  <style>
    :root {
      --ink: var(--du-ink);
      --ink-soft: var(--du-ink-soft);
      --muted: var(--du-muted);
      --line: var(--du-line);
      --card: var(--du-surface);
      --accent: var(--du-action);
      --accent-dark: var(--du-action-dark);
      --success: var(--du-success);
      --article-der: var(--du-der);
      --article-die: var(--du-die);
      --article-das: var(--du-das);
      --shadow: var(--du-shadow);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---- page shell: everything fits, nothing scrolls ---- */
    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: clamp(10px, 2.2vh, 20px) 16px clamp(12px, 2.4vh, 22px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(8px, 1.6vh, 14px);
      overflow: hidden;
    }

    /* ---- top strip ---- */
    .topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .page-title {
      margin: 0;
      font-size: clamp(1rem, 2.6vh, 1.3rem);
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .page-title small {
      display: block;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .score {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .score strong { color: var(--ink); font-size: 1rem; letter-spacing: 0; }

    .ghost-btn {
      height: 32px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink-soft);
      font: 600 .78rem inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }

    .ghost-btn:hover { border-color: var(--accent); color: var(--accent-dark); }

    /* ---- filters ---- */
    .filters {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-label {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .levels { display: flex; gap: 6px; }

    .level-button {
      height: 30px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font: 600 .74rem inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: all .15s;
    }

    .level-button:hover { border-color: var(--ink-soft); color: var(--ink); }
    .level-button.active { background: var(--ink); border-color: var(--ink); color: #fff; }

    .category-select {
      flex: 1 1 180px;
      min-width: 150px;
      height: 30px;
      padding: 0 30px 0 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background-color: var(--card);
      color: var(--ink);
      font: 600 .74rem inherit;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2361798f'><path d='M5.5 7.5l4.5 5 4.5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 13px;
    }

    .category-select:focus { outline: none; border-color: var(--accent); }

    /* ---- the card ---- */
    .card-area {
      flex: 0 1 auto;
      min-height: 0;
      margin-top: clamp(6px, 2vh, 18px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .practice-card {
      flex: 0 1 auto;
      width: 100%;
      max-width: 480px;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2.6vh, 26px) clamp(16px, 3vw, 26px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .word-zone {
      flex: 1 1 auto;
      min-height: clamp(84px, 15vh, 132px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, .8vh, 8px);
      overflow: hidden;
    }

    .word {
      font-size: clamp(1.6rem, min(8vw, 6.4vh), 3.4rem);
      font-weight: 700;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .meaning {
      color: var(--muted);
      font-size: clamp(.82rem, 2vh, 1rem);
      line-height: 1.3;
    }

    .feedback {
      min-height: 1.4em;
      font-size: clamp(.78rem, 1.9vh, .95rem);
      font-weight: 700;
      white-space: pre-line;
    }

    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--accent-dark); }

    .options {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-top: clamp(10px, 2vh, 18px);
    }

    .article-option {
      height: clamp(42px, 7.2vh, 58px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      color: #fff;
      font: 700 clamp(.95rem, 2.4vh, 1.15rem) inherit;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }

    .article-option[data-article="der"] { background: var(--article-der); }
    .article-option[data-article="die"] { background: var(--article-die); }
    .article-option[data-article="das"] { background: var(--article-das); }
    .article-option:hover:not(:disabled) { filter: brightness(1.08); }
    .article-option:active:not(:disabled) { transform: translateY(1px); }
    .article-option:disabled { opacity: .5; cursor: default; }

    .card-actions {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: clamp(8px, 1.6vh, 14px);
    }

    .tip-example { background: #f1e6d8; }
    .tip-item h3 { color: var(--ink); }

    @media (max-width: 480px) {
      .site-navbar { gap: 10px; }
      .topbar { flex-wrap: wrap; }
      .category-select { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <nav class="site-navbar" aria-label="Practice activities">
    <div class="site-links">
      <a class="site-link" href="verbs.html">German Verbs</a>
      <a class="site-link" href="vocab.html">Vocabulary Flashcards</a>
      <a class="site-link" href="prep.html">Preposition Practice</a>
      <a class="site-link active" href="articles.html">Article Practice</a>
      <a class="site-link" href="pronouns.html">Pronoun Practice</a>
      <a class="site-link" href="translation.html">Translation Practice</a>
    </div>
  </nav>
  <script>if (window.top !== window.self) document.currentScript.previousElementSibling.style.display = "none";</script>

  <main>
    <div class="topbar">
      <h1 class="page-title">Der, die oder das?<small>Article practice</small></h1>
      <div class="topbar-right">
        <span class="score"><strong id="score">0 / 0</strong>correct</span>
        <button class="ghost-btn" id="tipsButton" type="button">Tips</button>
      </div>
    </div>

    <div class="filters" aria-label="Article practice filters">
      <span class="filter-label">Level</span>
      <div class="levels" id="levels"></div>
      <span class="filter-label">Category</span>
      <select class="category-select" id="category" aria-label="Category"></select>
    </div>

    <div class="card-area">
      <section class="practice-card" aria-live="polite">
        <div class="word-zone">
          <div class="word" id="word">Loading...</div>
          <div class="meaning" id="meaning"></div>
          <div class="feedback" id="feedback"></div>
        </div>
        <div class="options" id="options">
          <button class="article-option" data-article="der" type="button">der</button>
          <button class="article-option" data-article="die" type="button">die</button>
          <button class="article-option" data-article="das" type="button">das</button>
        </div>
        <div class="card-actions">
          <button class="ghost-btn" id="next" type="button">Next word</button>
          <button class="ghost-btn" id="shuffle" type="button">Shuffle</button>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="tipsModal" tabindex="-1" aria-labelledby="tipsTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="tipsTitle">Remembering German articles</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="tipsList"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function loadJson(path) {
      const request = new XMLHttpRequest();
      request.open("GET", path, false);
      request.send(null);
      if (request.status !== 200 && request.status !== 0) throw new Error("Could not load " + path);
      return JSON.parse(request.responseText);
    }

    const nouns = loadJson("../data/vocabulary.json").filter((card) =>
      card.type === "noun" && ["der", "die", "das"].includes(card.article)
    );
    const articleTips = loadJson("../data/article-tips.json");
    const levels = ["A1", "A2", "B1"];
    const categoryLabels = {
      general: "General", food: "Food & Drink", travel_transport: "Travel & Transport",
      shopping_clothing: "Shopping & Clothing", home_living: "Home & Living",
      work_office: "Work & Office", tech_media: "Tech & Media", school_education: "School & Education",
      sports_leisure: "Sports & Leisure", colors: "Colors", body_parts: "Body Parts",
      fruits_vegetables: "Fruits & Vegetables", time_seasons: "Time & Seasons",
      countries: "Countries", language: "Language", communication: "Communication",
      emotions_personality: "Emotions", events_celebrations: "Events & Celebrations", health: "Health",
      nationality: "Nationality", nature_animals: "Nature & Animals", numbers: "Numbers",
      people_relationships: "People & Family"
    };
    const categories = [...new Set(nouns.map((card) => card.category))].sort((a, b) =>
      (categoryLabels[a] || a).localeCompare(categoryLabels[b] || b)
    );
    let activeLevels = levels.slice();
    let activeCategory = "ALL";
    const levelsElement = document.getElementById("levels");
    const categoryElement = document.getElementById("category");
    const tipsModal = new bootstrap.Modal(document.getElementById("tipsModal"));
    const wordElement = document.getElementById("word");
    const meaningElement = document.getElementById("meaning");
    const feedbackElement = document.getElementById("feedback");
    const scoreElement = document.getElementById("score");
    const optionElements = [...document.querySelectorAll(".article-option")];
    let deck = [];
    let index = 0;
    let correct = 0;
    let attempts = 0;
    let answered = false;

    function filteredNouns() {
      return nouns.filter((card) => {
        if (!activeLevels.includes(card.level)) return false;
        if (activeCategory === "COGNATE" && !card.cognate) return false;
        if (activeCategory === "OPPOSITE" && !card.opposite) return false;
        if (! ["ALL", "COGNATE", "OPPOSITE"].includes(activeCategory) && card.category !== activeCategory) return false;
        return true;
      });
    }

    function shuffle(items) {
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function renderTips() {
      document.getElementById("tipsList").innerHTML = articleTips.map((item) =>
        '<article class="tip-item border-top pt-3 pb-3"><h3 class="h6">'+item.title+'</h3><p class="text-muted small">'+item.tip+'</p><div class="d-flex flex-wrap gap-2">'+
        item.examples.map((example) => '<span class="tip-example badge rounded-pill text-dark fw-normal px-3 py-2">'+example+'</span>').join("")+"</div></article>"
      ).join("");
    }

    function updateScore() {
      scoreElement.textContent = correct + " / " + attempts;
    }

    function articleReason(card) {
      const word = card.stem.toLocaleLowerCase("de");
      const endings = {
        der: [["ling", "Words ending in -ling are masculine."], ["ismus", "Words ending in -ismus are masculine."], ["or", "Words ending in -or are masculine."], ["er", "Many person and occupation nouns ending in -er are masculine."]],
        die: [["ung", "Words ending in -ung are feminine."], ["heit", "Words ending in -heit are feminine."], ["keit", "Words ending in -keit are feminine."], ["schaft", "Words ending in -schaft are feminine."], ["tät", "Words ending in -tät are feminine."], ["ion", "Words ending in -ion are feminine."], ["ik", "Words ending in -ik are feminine."], ["ei", "Words ending in -ei are feminine."], ["e", "Many non-compound nouns ending in -e are feminine."]],
        das: [["chen", "Diminutives ending in -chen are neuter."], ["lein", "Diminutives ending in -lein are neuter."], ["tum", "Words ending in -tum are neuter."], ["ment", "Words ending in -ment are neuter."], ["um", "Many words ending in -um are neuter."]]
      };
      const match = endings[card.article].find(([ending]) => word.endsWith(ending));
      if (match) return match[1];
      if (card.article === "der" && card.category === "time_seasons") return "Days, months, seasons, and many time words are masculine.";
      if (card.article === "das" && word.endsWith("en")) return "Infinitives used as nouns are neuter.";
      return "There is no reliable ending rule here, so learn “" + card.article + " " + card.stem + "” as one vocabulary item.";
    }

    function renderCard() {
      if (!deck.length) {
        wordElement.textContent = "No words found";
        meaningElement.textContent = "Try another level or category.";
        feedbackElement.textContent = "";
        optionElements.forEach((button) => { button.disabled = true; });
        return;
      }
      const card = deck[index];
      answered = false;
      wordElement.textContent = card.stem;
      meaningElement.textContent = card.en;
      feedbackElement.textContent = "";
      feedbackElement.className = "feedback";
      optionElements.forEach((button) => { button.disabled = false; });
    }

    function answer(article) {
      if (answered) return;
      answered = true;
      const card = deck[index];
      attempts += 1;
      optionElements.forEach((button) => { button.disabled = true; });
      if (article === card.article) {
        correct += 1;
        feedbackElement.textContent = "Correct\nReason: " + articleReason(card);
        feedbackElement.className = "feedback correct";
      } else {
        feedbackElement.textContent = "Incorrect — the answer is " + card.article + "\nReason: " + articleReason(card);
        feedbackElement.className = "feedback wrong";
      }
      meaningElement.textContent = card.en;
      updateScore();
    }

    function nextWord() {
      index = (index + 1) % deck.length;
      renderCard();
    }

    function reshuffle() {
      deck = shuffle(filteredNouns());
      index = 0;
      renderCard();
    }

    function renderFilters() {
      levelsElement.innerHTML = "";
      levels.forEach((level) => {
        const button = document.createElement("button");
        button.className = "level-button" + (activeLevels.includes(level) ? " active" : "");
        button.type = "button";
        button.textContent = level + " (" + nouns.filter((card) => card.level === level).length + ")";
        button.addEventListener("click", () => {
          if (activeLevels.includes(level)) {
            if (activeLevels.length === 1) return;
            activeLevels = activeLevels.filter((item) => item !== level);
          } else {
            activeLevels.push(level);
          }
          renderFilters();
          reshuffle();
        });
        levelsElement.appendChild(button);
      });

      categoryElement.innerHTML = '<option value="ALL">All categories</option>' +
        '<option value="COGNATE">≈ Like English (cognates)</option>' +
        '<option value="OPPOSITE">↔ Words with Opposites</option>' +
        categories.map((category) => '<option value="'+category+'">'+(categoryLabels[category] || category)+'</option>').join("");
      categoryElement.value = activeCategory;
    }

    optionElements.forEach((button) => button.addEventListener("click", () => answer(button.dataset.article)));
    document.getElementById("next").addEventListener("click", nextWord);
    document.getElementById("shuffle").addEventListener("click", reshuffle);
    document.getElementById("tipsButton").addEventListener("click", () => tipsModal.show());
    categoryElement.addEventListener("change", () => {
      activeCategory = categoryElement.value;
      reshuffle();
    });
    renderFilters();
    renderTips();
    reshuffle();
  </script>
</body>
</html>
